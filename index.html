<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar layout</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#202124',
            sub: '#5f6368',
            label: '#80868b',
            line: '#dadce0',
            primary: '#2fa84f',
            primaryDark: '#268f43',
            req: '#d93025',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/styles.css?v=9" />
</head>
<body class="bg-[#f1f3f4] text-ink">

  <!-- Демо-обгортка, що імітує частину великої форми бекофіса -->
  <main class="mx-auto max-w-3xl p-6 sm:p-10">
    <div class="rounded-lg bg-white p-6 ring-1 ring-line sm:p-8">

      <!-- Поле форми: Calendar layout -->
      <div class="text-[15px] font-medium text-label">Calendar layout <span class="text-req">*</span></div>

      <div class="mt-3 flex items-center justify-between gap-4">
        <div class="flex items-center gap-7">
          <label class="flex cursor-pointer items-center gap-2 text-[15px]">
            <input type="radio" name="kind" value="grid" class="h-[18px] w-[18px] accent-ink" /> Grid
          </label>
          <label class="flex cursor-pointer items-center gap-2 text-[15px]">
            <input type="radio" name="kind" value="map" class="h-[18px] w-[18px] accent-ink" /> Map
          </label>
        </div>
        <button id="previewBtn" class="text-sm text-primary transition hover:underline">👁 Preview</button>
      </div>

      <!-- Обраний патерн (тільки для Map) -->
      <div id="patternRow" class="mt-4" hidden>
        <div class="mb-1.5 text-[13px] text-sub">Pattern</div>
        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center gap-3 rounded-md border border-line bg-white px-3 py-2">
            <div id="patternThumb" class="h-8 w-12 shrink-0 text-sub"></div>
            <span id="patternName" class="text-[15px] leading-none">—</span>
          </div>
          <button id="choosePatternBtn"
            class="rounded-md border border-line bg-white px-4 py-2 text-sm transition hover:bg-gray-50">
            Choose pattern
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Модалка: галерея патернів + редактор -->
  <div id="patternModal" class="fixed inset-0 z-50 items-center justify-center p-4" style="display:none">
    <div class="absolute inset-0 bg-black/40" data-close-pattern></div>
    <div class="relative flex max-h-[90vh] w-full max-w-2xl flex-col overflow-hidden rounded-lg bg-white shadow-2xl">

      <!-- Head -->
      <div class="flex items-center justify-between border-b border-line px-5 py-4">
        <h2 id="modalHeading" class="text-base font-medium">Choose pattern</h2>
        <button class="text-sub transition hover:text-ink" data-close-pattern aria-label="Close">✕</button>
      </div>

      <!-- Галерея -->
      <div id="galleryView" class="flex min-h-0 flex-1 flex-col">
        <div id="patternGrid" class="grid flex-1 grid-cols-2 gap-3 overflow-auto p-5 sm:grid-cols-3"></div>
        <div class="flex items-center justify-between gap-3 border-t border-line px-5 py-4">
          <span class="text-[13px] text-sub">or arrange the prizes yourself</span>
          <button id="createOwnBtn"
            class="rounded-md bg-primary px-4 py-2 text-sm font-medium text-white transition hover:bg-primaryDark">
            Create your own
          </button>
        </div>
      </div>

      <!-- Редактор (вкладки Edit / Preview) -->
      <div id="editorView" class="flex min-h-0 flex-1 flex-col" hidden>
        <!-- перемикач Edit / Preview -->
        <div class="flex items-center border-b border-line px-5 py-3">
          <div class="inline-flex rounded-md bg-gray-100 p-0.5 ring-1 ring-line">
            <button id="tabEdit" class="ws-tab rounded px-3 py-1 text-[13px]">✏️ Edit layout</button>
            <button id="tabPreview" class="ws-tab rounded px-3 py-1 text-[13px]">👁 Preview</button>
          </div>
        </div>

        <!-- пейн редагування -->
        <div id="editPane" class="flex min-h-0 flex-1 flex-col">
          <div class="flex flex-wrap items-center gap-4 border-b border-line px-5 py-2.5">
            <label class="flex cursor-pointer items-center gap-2 text-[13px]">
              <input type="checkbox" id="snapToggle" class="h-4 w-4 accent-ink" /> Snap to grid
            </label>
            <button id="copyCoordsBtn" class="rounded-md border border-line px-3 py-1.5 text-[13px] transition hover:bg-gray-50">📋 Copy coordinates</button>
            <button id="clearCustomBtn" class="rounded-md border border-line px-3 py-1.5 text-[13px] transition hover:bg-gray-50">↺ Reset</button>
            <span class="ml-auto text-[12px] text-sub">Drag prizes to position them</span>
          </div>
          <div class="min-h-0 flex-1 overflow-auto p-5">
            <div id="editorBoard" class="ed-board"></div>
          </div>
        </div>

        <!-- пейн прев'ю (того ж драфта) -->
        <div id="edPreviewPane" class="flex min-h-0 flex-1 flex-col" hidden>
          <div class="flex items-center gap-3 border-b border-line px-5 py-2.5">
            <div class="inline-flex rounded-md bg-gray-100 p-0.5 ring-1 ring-line">
              <button data-edevice="desktop" class="ed-pv-tab rounded px-3 py-1 text-[13px]">🖥 Desktop</button>
              <button data-edevice="mobile" class="ed-pv-tab rounded px-3 py-1 text-[13px]">📱 Mobile</button>
            </div>
            <span id="edPreviewLabel" class="ml-auto text-[12px] text-sub"></span>
          </div>
          <div class="min-h-0 flex-1 overflow-auto bg-[#f1f3f4] p-6">
            <div id="edDeviceWrap" class="device device--desktop mx-auto w-fit">
              <div class="device-frame">
                <div class="device-bar"></div>
                <div class="pv-screen"><div id="edPreviewBoard"></div></div>
              </div>
            </div>
          </div>
        </div>

        <!-- футер -->
        <div class="flex items-center justify-between gap-3 border-t border-line px-5 py-4">
          <button id="backBtn" class="rounded-md px-4 py-2 text-sm text-sub transition hover:text-ink">← Back</button>
          <button id="saveOwnBtn"
            class="rounded-md bg-primary px-5 py-2 text-sm font-medium text-white transition hover:bg-primaryDark">
            Save layout
          </button>
        </div>
      </div>

      <!-- Прев'ю Desktop / Mobile -->
      <div id="previewView" class="flex min-h-0 flex-1 flex-col" hidden>
        <div class="flex items-center gap-3 border-b border-line px-5 py-3">
          <div class="inline-flex rounded-md bg-gray-100 p-0.5 ring-1 ring-line">
            <button data-device="desktop" class="pv-tab rounded px-3 py-1 text-[13px]">🖥 Desktop</button>
            <button data-device="mobile" class="pv-tab rounded px-3 py-1 text-[13px]">📱 Mobile</button>
          </div>
          <span id="previewLabel" class="ml-auto text-[12px] text-sub"></span>
        </div>

        <div class="min-h-0 flex-1 overflow-auto bg-[#f1f3f4] p-6">
          <div id="deviceWrap" class="device device--desktop mx-auto w-fit">
            <div class="device-frame">
              <div class="device-bar"></div>
              <div class="pv-screen"><div id="previewBoard"></div></div>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between border-t border-line px-5 py-4">
          <button id="previewBackBtn" class="rounded-md px-4 py-2 text-sm text-sub transition hover:text-ink">← Back</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
