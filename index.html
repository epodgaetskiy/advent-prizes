<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar layout</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#202124',
            sub: '#5f6368',
            label: '#80868b',
            line: '#dadce0',
            primary: '#2fa84f',
            primaryDark: '#268f43',
            req: '#d93025',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/styles.css?v=14" />
</head>
<body class="bg-[#f1f3f4] text-ink">

  <!-- Демо-обгортка, що імітує частину великої форми бекофіса -->
  <main class="mx-auto max-w-3xl p-6 sm:p-10">
    <div class="rounded-lg bg-white p-6 ring-1 ring-line sm:p-8">

      <!-- Поле форми: Calendar layout -->
      <div class="text-[15px] font-medium text-label">Calendar layout <span class="text-req">*</span></div>

      <div class="mt-3 flex items-center gap-7">
        <label class="flex cursor-pointer items-center gap-2 text-[15px]">
          <input type="radio" name="kind" value="grid" class="h-[18px] w-[18px] accent-ink" /> Grid
        </label>
        <label class="flex cursor-pointer items-center gap-2 text-[15px]">
          <input type="radio" name="kind" value="map" class="h-[18px] w-[18px] accent-ink" /> Map
        </label>
      </div>

      <!-- Обраний патерн (тільки для Map) -->
      <div id="patternRow" class="mt-4" hidden>
        <div class="mb-1.5 text-[13px] text-sub">Pattern</div>
        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center gap-3 rounded-md border border-line bg-white px-3 py-2">
            <div id="patternThumb" class="h-8 w-12 shrink-0 text-sub"></div>
            <span id="patternName" class="text-[15px] leading-none">—</span>
          </div>
          <button id="choosePatternBtn"
            class="rounded-md border border-line bg-white px-4 py-2 text-sm transition hover:bg-gray-50">
            Choose pattern
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Широкий модал: зліва патерни, справа Edit / Preview -->
  <div id="cfgModal" class="fixed inset-0 z-50 items-center justify-center p-4" style="display:none">
    <div class="absolute inset-0 bg-black/40" data-close></div>
    <div class="relative flex h-[88vh] w-full max-w-6xl flex-col overflow-hidden rounded-lg bg-white shadow-2xl">

      <!-- Head -->
      <div class="flex items-center justify-between gap-3 border-b border-line px-5 py-3">
        <h2 class="text-base font-medium">Calendar layout</h2>
        <div class="flex items-center gap-3">
          <span id="autosaveHint" class="text-[12px] text-sub"></span>
          <button id="saveOwnBtn"
            class="rounded-md bg-primary px-4 py-1.5 text-sm font-medium text-white transition hover:bg-primaryDark">
            Save layout
          </button>
          <button class="text-sub transition hover:text-ink" data-close aria-label="Close">✕</button>
        </div>
      </div>

      <div class="flex min-h-0 flex-1">
        <!-- Сайдбар: вибір патернів -->
        <aside id="sidebar" class="flex w-60 shrink-0 flex-col border-r border-line">
          <div class="px-4 pt-4 pb-2 text-[11px] font-semibold uppercase tracking-wide text-label">Patterns</div>
          <div id="patternList" class="flex-1 space-y-1 overflow-auto px-3 pb-3"></div>
        </aside>

        <!-- Основна частина: Edit / Preview -->
        <section class="flex min-h-0 flex-1 flex-col">
          <div class="flex items-center gap-3 border-b border-line px-5 py-3">
            <div class="inline-flex rounded-md bg-gray-100 p-0.5 ring-1 ring-line">
              <button id="wsTabEdit" class="ws-tab rounded px-4 py-1.5 text-[13px]">✏️ Edit</button>
              <button id="wsTabPreview" class="ws-tab rounded px-4 py-1.5 text-[13px]">👁 Preview</button>
            </div>
            <span id="wsLayoutName" class="text-[13px] text-sub"></span>
            <div id="deviceToggle" class="ml-auto inline-flex rounded-md bg-gray-100 p-0.5 ring-1 ring-line" hidden>
              <button data-device="desktop" class="pv-tab rounded px-3 py-1 text-[13px]">🖥 Desktop</button>
              <button data-device="mobile" class="pv-tab rounded px-3 py-1 text-[13px]">📱 Mobile</button>
            </div>
          </div>

          <!-- Edit -->
          <div id="editPane" class="flex min-h-0 flex-1 flex-col">
            <div class="flex flex-wrap items-center gap-4 border-b border-line px-5 py-2">
              <label class="flex cursor-pointer items-center gap-2 text-[13px]">
                <input type="checkbox" id="snapToggle" class="h-4 w-4 accent-ink" /> Snap to grid
              </label>
              <button id="copyCoordsBtn" class="rounded-md border border-line px-3 py-1.5 text-[13px] transition hover:bg-gray-50">📋 Copy coordinates</button>
              <button id="clearCustomBtn" class="rounded-md border border-line px-3 py-1.5 text-[13px] transition hover:bg-gray-50">↺ Reset</button>
              <span class="ml-auto text-[12px] text-sub">Drag prizes to position them</span>
            </div>
            <div class="min-h-0 flex-1 overflow-auto p-5">
              <div id="editorBoard" class="ed-board ed-board--lg"></div>
            </div>
          </div>

          <!-- Preview -->
          <div id="previewPane" class="min-h-0 flex-1 overflow-auto bg-[#f1f3f4] p-6" hidden>
            <div id="deviceWrap" class="device device--desktop mx-auto w-fit">
              <div class="device-frame">
                <div class="device-bar"></div>
                <div class="pv-screen"><div id="previewBoard"></div></div>
              </div>
            </div>
          </div>

        </section>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=14"></script>
  <script src="js/app.js?v=14"></script>
</body>
</html>
