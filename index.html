<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Адвент-календар із призами та різними варіантами розкладки" />
  <title>🎁 Адвент-календар</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
</head>
<body>
  <header class="header">
    <h1 class="header__title">🎁 Адвент-календар</h1>
    <p class="header__subtitle">Відкривай по одному віконцю щодня</p>

    <div class="controls">
      <div class="controls__group" id="layoutControls" role="group" aria-label="Варіанти розкладки">
        <!-- кнопки варіантів генеруються в app.js -->
      </div>
      <button class="btn" id="modeToggle" type="button">✏️ Редагувати</button>
      <button class="btn btn--ghost" id="resetBtn" type="button">↺ Скинути прогрес</button>
    </div>

    <div class="editbar" id="editbar" hidden>
      <span class="editbar__hint">✏️ Перетягуй призи, щоб розставити. Координати зберігаються автоматично. Кнопки розкладок вгорі — взяти за основу.</span>
      <label class="editbar__snap">
        <input type="checkbox" id="snapToggle" /> Прив'язка до сітки
      </label>
      <button class="btn btn--ghost btn--sm" id="copyCoordsBtn" type="button">📋 Копіювати координати</button>
      <button class="btn btn--ghost btn--sm" id="clearCustomBtn" type="button">↺ Очистити мій лейаут</button>
    </div>
  </header>

  <main class="stage" id="stage" aria-label="Поле календаря">
    <div class="board" id="board">
      <!-- клітинки генеруються в app.js -->
    </div>
  </main>

  <!-- Модалка призу -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__close" data-close aria-label="Закрити">✕</button>
      <div class="modal__day" id="modalDay"></div>
      <img class="modal__img" id="modalImg" alt="" />
      <h2 class="modal__title" id="modalTitle"></h2>
      <p class="modal__desc" id="modalDesc"></p>
    </div>
  </div>

  <footer class="footer">
    Зроблено з ❤️ — координати призів і розкладки налаштовуються у <code>js/data.js</code>
  </footer>

  <script src="js/data.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
